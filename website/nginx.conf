server {
    listen 80;
    server_name codex-claw.nabocorp.com;
    return 301 https://$host$request_uri;
}

server {
    http2 on;
    listen 443 ssl;
    server_name codex-claw.nabocorp.com;

    ssl_certificate /etc/letsencrypt/live/codex-claw.nabocorp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codex-claw.nabocorp.com/privkey.pem;

    root /var/www/codex-claw/site;
    index index.html;
    charset UTF-8;
    client_max_body_size 2m;

    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/.well-known/acme-challenge/;
    }

    # Electron auto-update artifacts are published outside the website root,
    # matching scripts/publish-macos.mjs and the updater's /desktop/releases URL.
    location ^~ /desktop/downloads/ {
        alias /var/www/codex-claw/downloads/;
        autoindex off;
        add_header Cache-Control "no-cache";
    }

    location ^~ /desktop/releases/ {
        alias /var/www/codex-claw/releases/;
        autoindex off;
        add_header Cache-Control "no-cache";
    }

    # Documentation is a static VitePress site; missing pages must not show
    # the marketing landing page. HTML URLs also work without rewrites.
    location /docs/ {
        try_files $uri $uri/ =404;
        error_page 404 /docs/404.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location ~* \.(?:conf|env|log|map)$ {
        deny all;
        return 404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
    sendfile on;
}
