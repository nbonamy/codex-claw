server {
    listen 80;
    server_name __WEBSITE_HOST__;
    root __DEPLOYMENT_ROOT__/site;
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    http2 on;
    listen 443 ssl;
    server_name __WEBSITE_HOST__;

    ssl_certificate /etc/letsencrypt/live/__WEBSITE_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__WEBSITE_HOST__/privkey.pem;

    root __DEPLOYMENT_ROOT__/site;
    index index.html;
    charset UTF-8;
    client_max_body_size 2m;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    # Preserve existing installer/feed endpoints independently of website deploys.
    # A future stable bridge is separate; do not redirect this JSON feed.
    location ^~ /desktop/downloads/ {
        alias __DEPLOYMENT_ROOT__/downloads/;
        autoindex off;
        add_header Cache-Control "no-cache";
    }

    location ^~ /desktop/releases/ {
        alias __DEPLOYMENT_ROOT__/releases/;
        autoindex off;
        add_header Cache-Control "no-cache";
    }

    # Documentation is a static VitePress site; missing pages must not show
    # the marketing landing page. HTML URLs also work without rewrites.
    location /docs/ {
        try_files $uri $uri/ =404;
        error_page 404 /docs/404.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location ~* \.(?:conf|env|log|map)$ {
        deny all;
        return 404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
    sendfile on;
}
