name: Desktop publication
run-name: publish ${{ inputs.build_run_id }} ${{ inputs.build_attempt }} ${{ inputs.channel }} ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Desktop builds run
        required: true
      build_attempt:
        description: Exact successful build attempt
        required: true
      channel:
        description: Publication channel
        type: choice
        options: [prerelease, latest]
        required: true
      request_id:
        description: Unique publication request
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-publication
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - name: Verify build, upload assets and publish release
        run: node scripts/publish-desktop.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUILD_RUN: ${{ inputs.build_run_id }}
          RELEASE_BUILD_ATTEMPT: ${{ inputs.build_attempt }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
